services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cityai}
      POSTGRES_USER: "${DB_USER:?DB_USER is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Bind to localhost only (do not expose database ports publicly by default)
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:?DB_NAME is required}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_URL: "${DB_URL:?DB_URL is required}"
      DB_USERNAME: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL: http://ai-service:8000
      DATA_DIR: /data
      EVIDENCE_DIR: /data/evidence
      INGEST_USERNAME: "${INGEST_USERNAME:?INGEST_USERNAME is required}"
      INGEST_PASSWORD: "${INGEST_PASSWORD:?INGEST_PASSWORD is required}"
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"

  ai-service:
    build: ./ai-service
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_URL: http://backend:8080
      INGEST_USERNAME: "${INGEST_USERNAME:?INGEST_USERNAME is required}"
      INGEST_PASSWORD: "${INGEST_PASSWORD:?INGEST_PASSWORD is required}"
    volumes:
      - ./videos:/app/videos:ro
      - ./data:/data
      - ai-models:/app/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data:
  ai-models:
  redis-data:

