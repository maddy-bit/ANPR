# Production datasource profile - PostgreSQL + PostGIS.
#
# Activate with: SPRING_PROFILES_ACTIVE=postgres mvn spring-boot:run
# (or set spring.profiles.active in application.yml / an env var).
#
# This is genuinely tested, not just written: see README's "Production
# datasource (PostgreSQL + PostGIS)" section for the exact commands used
# to create the database, enable PostGIS, and run the backend against it.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:postgres.xzhblfqmjxywoileaopa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  h2:
    console:
      enabled: false

app:
  seed-cameras: false
